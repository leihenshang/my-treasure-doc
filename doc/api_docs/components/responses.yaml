# 共享响应对象（OpenAPI components.responses）
#
# 说明：
#   - 端点文件只对「成功响应」内联声明 data 结构（allOf 组合 Envelope + data），
#     失败响应统一引用本文件里的具名响应对象，避免同一错误码在 119 个文件里重复描述。
#   - 业务成功与失败通常都返回 HTTP 200，仅靠响应体 code 区分；但认证/权限/限流
#     中间件会返回真实的 401 / 403 / 429。
#   - data 的取值规则：commonresponse.Error 恒为 null；字段级校验失败用
#     ErrorWithData 带出 `{"field": "..."}`；用户模块的 FailWithMessage 为 `{}`。

# ===========================================================================
# 通用
# ===========================================================================

RateLimited:
  description: |
    触发限流（HTTP 429）。仅作用于 `/api/user/login`（0.1/s，容量 5）、
    `/api/blog-mgr/uploads/`（0.5/s，容量 20）、`/api/publish`（0.2/s，容量 20），按客户端 IP 令牌桶计数。
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Envelope'
      example:
        code: 42900
        msg: 请求过于频繁，请稍后再试
        data: null

# ===========================================================================
