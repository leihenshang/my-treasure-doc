      schema:
        $ref: './schemas.yaml#/Envelope'
      examples:
        missing:
          value:
            code: 40100
            msg: 未配置 NAS 备份令牌
            data: null
        invalid:
          value:
            code: 40100
            msg: NAS 备份令牌无效
            data: null

BackupIPForbidden:
  description: 来源 IP 不在白名单内（HTTP 403，code 40300）；仅当配置了 `backup.allowIPs` 时校验
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Envelope'
      example:
        code: 40300
        msg: 来源 IP 不在白名单内
        data: null