# 共享参数（OpenAPI components.parameters）
#
# 端点文件里凡是同名参数（分页、筛选、路径 ID 等）都引用本文件，避免 119 个文件各写一份。

# ---------------------------------------------------------------------------
# 分页与排序
# ---------------------------------------------------------------------------

PublicPage:
  name: page
  in: query
  required: false
  description: 页码，从 1 开始
  schema:
    type: integer
    minimum: 1
    default: 1

PublicPageSize:
  name: pageSize
  in: query
  required: false
  description: 每页条数
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

ManagePage:
  name: page
  in: query
  required: false
  description: 页码，从 1 开始
  schema:
    type: integer
    minimum: 1
    default: 1

ManagePageSize:
  name: pageSize
  in: query
  required: false
  description: 每页条数
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

PublicSort:
  name: sort
  in: query
  required: false
  description: 排序方向，作用于发布日期（置顶项恒在最前）
  schema:
    type: string
    enum: [asc, desc]
    default: desc

ManageSort:
  name: sort
  in: query
  required: false
  description: 排序方向，作用于创建时间
  schema:
    type: string
    enum: [asc, desc]
    default: desc

# ---------------------------------------------------------------------------
# 公开博客筛选
# ---------------------------------------------------------------------------

PublicCategoryFilter:
  name: categoryId
  in: query
  required: false
  description: 分类 slug（取自 `GET /api/blog/categories` 的 `id`）
  schema:
    type: string

PublicTagFilter:
  name: tag
  in: query
  required: false
  description: 标签 slug
  schema:
    type: string

PublicKeyword:
  name: keyword
  in: query
  required: false
  description: 关键词，匹配标题与摘要
  schema:
    type: string

# ---------------------------------------------------------------------------
# 公开博客路径参数
# ---------------------------------------------------------------------------

PostID:
  name: id
  in: path
  required: true
  description: 文章 slug
  schema:
    type: string
    minLength: 1
    maxLength: 128

DiaryID:
  name: id
  in: path
  required: true
  description: 日记 publicId
  schema:
    type: string
    minLength: 1
    maxLength: 128

PortfolioItemID:
  name: id
  in: path
  required: true
  description: 作品 slug
  schema:
    type: string
    minLength: 1
    maxLength: 128

ToolID:
  name: id
  in: path
  required: true
  description: 工具 slug
  schema:
    type: string
    minLength: 1
    maxLength: 128

# ---------------------------------------------------------------------------
# 管理端筛选
# ---------------------------------------------------------------------------

ManageKeyword:
  name: keyword
  in: query
  required: false
  description: 关键词模糊搜索
  schema:
    type: string

ManageStatus:
  name: status
  in: query
  required: false
  description: 按发布状态过滤；留空表示全部
  schema:
    type: string
    enum: [draft, published, archived]

ManageDeleted:
  name: deleted
  in: query
  required: false
  description: 回收站过滤：`exclude` 排除已删除、`only` 仅已删除、`all` 全部
  schema:
    type: string
    enum: [exclude, only, all]
    default: exclude

ManageScope:
  name: scope
  in: query
  required: false
  description: 按分类适用范围过滤（categories 列表与发布端分类列表使用）
  schema:
    type: string
    enum: [post, portfolio, bookmark]

ManageCategoryFilter:
  name: categoryId
  in: query
  required: false
  description: 分类 slug
  schema:
    type: string

# ---------------------------------------------------------------------------
# 管理端路径参数
# ---------------------------------------------------------------------------

ManageID:
  name: id
  in: path
  required: true
  description: 资源 ID（雪花 ID）
  schema:
    type: string
    minLength: 1
    maxLength: 128

MediaName:
  name: name
  in: path
  required: true
  description: 媒体文件名（`<sha256>.<ext>`，不含路径分隔符）
  schema:
    type: string
    minLength: 1
    maxLength: 255

BackupName:
  name: name
  in: path
  required: true
  description: 备份文件名（不含路径分隔符）
  schema:
    type: string
    minLength: 1
    maxLength: 255

HistoryResource:
  name: resource
  in: path
  required: true
  description: 资源标识，仅 `posts` 与 `diaries` 有编辑历史
  schema:
    type: string
    enum: [posts, diaries]

HistoryRefID:
  name: id
  in: path
  required: true
  description: 资源 ID（雪花 ID）
  schema:
    type: string
    minLength: 1
    maxLength: 128

HistorySeq:
  name: seq
  in: path
  required: true
  description: 历史版本序号（从 1 开始）
  schema:
    type: integer
    minimum: 1

# ---------------------------------------------------------------------------
# 发布端路径参数
# ---------------------------------------------------------------------------

PublishSlug:
  name: slug
  in: path
  required: true
  description: 文章 slug（diaries 为 publicId）
  schema:
    type: string
    minLength: 1
    maxLength: 128

# ---------------------------------------------------------------------------
# 统计
# ---------------------------------------------------------------------------

VisitorDays:
  name: days
  in: query
  required: false
  description: 统计最近多少天
  schema:
    type: integer
    minimum: 1
    maximum: 365
    default: 7

MediaRefFilter:
  name: ref
  in: query
  required: false
  description: 按引用状态过滤：`all` 全部、`referenced` 仅被引用、`unreferenced` 仅未引用
  schema:
    type: string
    enum: [all, referenced, unreferenced]
    default: all