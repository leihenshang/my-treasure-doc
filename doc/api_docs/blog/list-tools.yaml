# GET /api/blog/tools —— 公开只读博客 API（工具列表）
# 注册位置：module/blog/router/router.go → RegisterService → blog.GET("/tools")
operationId: listBlogTools
tags: [public-blog]
summary: 工具列表
description: |
  返回全部已发布工具（`publishStatus = published`；工具没有发布时间，不做预约发布），
  按 `sortOrder` 升序（同序按 slug 升序）。整表返回、无分页。
  自研工具（`type = own`）返回 `cover`，外链工具（`type = link`）返回 `url`；
  两者都只有名称与描述，没有正文（原 `status` / `content` 已移除）。
security:
  - {}
responses:
  '200':
    description: 查询成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/PublicTool'
  '500':
    $ref: '../components/responses.yaml#/BlogInternal'