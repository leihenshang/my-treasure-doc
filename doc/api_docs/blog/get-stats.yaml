# GET /api/blog/stats —— 公开只读博客 API（站点统计）
# 注册位置：module/blog/router/router.go → RegisterService → blog.GET("/stats")
operationId: getBlogStats
tags: [public-blog]
summary: 站点统计
description: |
  返回站点公开统计：已发布文章、日记与作品的数量。
  仅统计 `publishStatus = published` 且 `publishedAt <= 当前时间` 的内容。
security:
  - {}
responses:
  '200':
    description: 查询成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/PublicStats'
  '500':
    $ref: '../components/responses.yaml#/BlogInternal'