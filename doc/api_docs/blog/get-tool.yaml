# GET /api/blog/tools/{id} —— 公开只读博客 API（自研工具详情）
# 注册位置：module/blog/router/router.go → RegisterService → blog.GET("/tools/:id")
operationId: getBlogTool
tags: [public-blog]
summary: 工具详情（路径参数为工具 slug，仅自研工具）
description: |
  按工具 slug 查询，且仅当该条目是自研工具（`kind = own`）且 `publishStatus = published` 时返回；
  外链工具（`kind = link`）没有详情页，同样返回 404；草稿 / 归档工具对公众 404。

  工具没有发布时间（不做预约发布），也移除了正文：返回名称、描述与封面。
security:
  - {}
parameters:
  - $ref: '../components/parameters.yaml#/ToolID'
responses:
  '200':
    description: 查询成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/PublicTool'
  '400':
    $ref: '../components/responses.yaml#/BlogInvalidQuery'
  '404':
    $ref: '../components/responses.yaml#/BlogToolNotFound'
  '500':
    $ref: '../components/responses.yaml#/BlogInternal'