# GET /api/blog/categories —— 公开只读博客 API（文章分类列表）
# 注册位置：module/blog/router/router.go → RegisterService → blog.GET("/categories")
operationId: listBlogCategories
tags: [public-blog]
summary: 文章分类列表
description: |
  仅返回「已启用」且至少有一篇已发布文章的分类（scope = post），按 `sortOrder` 升序。
  `id` 即分类 slug，可直接用作文章列表的 `categoryId` 过滤值，也是前端 `/Blog/Category/:slug` 的路径。
security:
  - {}
responses:
  '200':
    description: 查询成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/PublicCategory'
  '500':
    $ref: '../components/responses.yaml#/BlogInternal'