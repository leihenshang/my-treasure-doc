# GET /api/blog/portfolio/categories —— 公开只读博客 API（作品分类列表）
# 注册位置：module/blog/router/router.go → RegisterService → portfolio.GET("/categories")
operationId: listBlogPortfolioCategories
tags: [public-blog]
summary: 作品分类列表
description: |
  仅返回「已启用」且至少有一个已发布作品（scope = portfolio）的分类，按 `sortOrder` 升序。
  `id` 即分类 slug，可直接用作作品列表的 `categoryId` 过滤值。
security:
  - {}
responses:
  '200':
    description: 查询成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/PublicCategory'
  '500':
    $ref: '../components/responses.yaml#/BlogInternal'