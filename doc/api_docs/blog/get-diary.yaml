# GET /api/blog/diaries/{id} —— 公开只读博客 API（日记详情）
# 注册位置：module/blog/router/router.go → RegisterService → blog.GET("/diaries/:id")
operationId: getBlogDiary
tags: [public-blog]
summary: 日记详情（路径参数为日记 publicId）
description: |
  按日记 publicId 返回详情，含 Markdown 正文。
  仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的日记，
  草稿、归档、定时发布的日记一律按不存在处理（404）。

  `id` 是日记的 publicId，而非数据库 ID；每次访问会自增浏览量。
  响应中 `tags` 数组保证为空数组而非 null。
security:
  - {}
parameters:
  - $ref: '../components/parameters.yaml#/DiaryID'
responses:
  '200':
    description: 查询成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/PublicDiary'
  '400':
    $ref: '../components/responses.yaml#/BlogInvalidQuery'
  '404':
    $ref: '../components/responses.yaml#/BlogDiaryNotFound'
  '500':
    $ref: '../components/responses.yaml#/BlogInternal'