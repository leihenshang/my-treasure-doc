# GET /api/blog/bookmarks —— 公开只读博客 API（书签列表）
# 注册位置：module/blog/router/router.go → RegisterService → blog.GET("/bookmarks")
operationId: listBlogBookmarks
tags: [public-blog]
summary: 收藏集/书签列表
description: |
  仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的书签，
  按 `sortOrder` 升序（同序按标题升序）。整表返回、无分页。

  `keyword` 匹配标题、描述、地址与标签名。响应 `tags` 数组保证为空数组而非 null。
security:
  - {}
parameters:
  - $ref: '../components/parameters.yaml#/PublicCategoryFilter'
  - $ref: '../components/parameters.yaml#/PublicKeyword'
responses:
  '200':
    description: 查询成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/PublicBookmark'
  '500':
    $ref: '../components/responses.yaml#/BlogInternal'