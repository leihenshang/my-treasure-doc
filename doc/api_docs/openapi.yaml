components:
  securitySchemes:
    XToken:
      type: apiKey
      in: header
      name: X-Token
      description: 登录成功后签发的用户令牌；后台接口还要求 `userType` ∈ {2, 100}。
    XPublishToken:
      type: apiKey
      in: header
      name: X-Publish-Token
      description: 机器令牌；取值为后台「站点设置 → 发布令牌」配置的值，未配置时所有 `/api/publish/*` 请求返回 401。
    XBackupToken:
      type: apiKey
      in: header
      name: X-Backup-Token
      description: NAS 机器令牌；取值为后台配置的备份令牌（回退配置文件 `[backup].apiToken`）。