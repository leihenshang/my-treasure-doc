# POST /api/user/change-pwd —— 用户鉴权 API（修改当前用户密码）
# 注册位置：module/user/router/router.go → registerAPI → user 分组（API: module/user/api/user_manage_api.go UserChangePwd）
operationId: userChangePassword
tags: [user]
summary: 修改当前用户密码
description: |
  修改当前登录用户的密码，需要校验原密码。

  新密码长度 **8–16 位**，`rePassword` 必须与 `password` 一致。修改成功后服务端会清除该用户的
  `requirePwdReset` 标记。

  请求体校验失败（如字段缺失、密码长度不符）时由 binding 直接拒绝，返回 code 1 与具体 msg。
security:
  - XToken: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../components/schemas.yaml#/UserChangePwdInput'
responses:
  '200':
    description: |
      成功时 code 为 0、data 为 {}；失败时 code 为 1、msg 为具体原因（如「原密码错误」）、data 为 {}
      （该模块沿用「失败也返回 HTTP 200」的早期约定）。
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/EmptyData'
        examples:
          success:
            value:
              code: 0
              msg: 操作成功
              data: {}
          failure:
            value:
              code: 1
              msg: 原密码错误
              data: {}
  '401':
    $ref: '../components/responses.yaml#/UserUnauthorized'