          $ref: '#/components/schemas/ManageStatusCounts'
        bookmarks:
          $ref: '#/components/schemas/ManageStatusCounts'
        categories:
          type: integer
          format: int64
        tags:
          type: integer
          format: int64
        totalViews:
          type: integer
          format: int64
    ManageVisitorStat:
      type: object
      description: 单个访客 IP 在时间范围内的聚合
      required:
        - ip
        - count
        - firstSeen
        - lastSeen
        - categories
      properties:
        ip:
          type: string
        count:
          type: integer
          format: int64
          description: 访问次数
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        categories:
          type: array
          description: 访问过的去重内容分类标识（如 post、diary）
          items:
            type: string
    ManageVisitorStats:
      type: object
      description: 访客统计（时间范围内总量 + 按 IP 明细）
      required:
        - days
        - totalCount
        - distinctIp
        - list
      properties:
        days:
          type: integer
          format: int64
        totalCount:
          type: integer
          format: int64
        distinctIp:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/ManageVisitorStat'
    ManageUploadedImage:
      type: object
      description: 单图上传结果
      required:
        - path
      properties:
        path:
          type: string
          description: 可直接引用的公开路径，形如 `/files/blog/<sha256>.<ext>`
          example: /files/blog/9f2c8b1d....png
    EmptyData:
      type: object
      maxProperties: 0
      description: |
        失败响应中的空对象 `data`。用户模块与上传/备份类端点沿用早期约定：
        失败时 HTTP 仍为 200，`code: 1`、`msg` 为具体原因、`data` 固定为 `{}`。
        这些端点的 `data` 声明为「成功结构 或 EmptyData」的 oneOf。
    ManageUploadedMedia:
      type: object
      description: 单个媒体文件上传结果
      required:
        - path
        - name
        - size
        - existed
      properties:
        path:
          type: string
          example: /files/blog/9f2c8b1d....png
        name:
          type: string
          description: 存储文件名
        size:
          type: integer
          format: int64
        existed:
          type: boolean
          description: true 表示服务端已存在相同内容（sha256 相同），未重复写盘
    ManageUploadMediaList:
      type: object
      description: 多文件上传结果，顺序与提交顺序一致
      required:
        - list
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ManageUploadedMedia'
    ManageMediaReference:
      type: object
      description: 某资源字段对当前媒体文件的引用条数
      required:
        - resource
        - field
        - count
      properties:
        resource:
          type: string
          example: 文章
        field:
          type: string
          example: 正文
        count:
          type: integer
          format: int64
    ManageMediaFile:
      type: object
      description: 媒体库文件（/files/blog/ 下的上传文件）
      required:
        - name
        - path
        - size
        - modTime
        - referenced
        - referenceCount
        - references
        - originName
        - ext
        - mime
        - width
        - height
      properties:
        name:
          type: string
          description: 存储文件名 `<sha256>.<ext>`
        path:
          type: string
          description: 可直接引用的公开路径
          example: /files/blog/9f2c....png
        size:
          type: integer
          format: int64
        modTime:
          type: string
          description: 文件修改时间（RFC3339）
        referenced:
          type: boolean
          description: 是否被任意内容引用（未引用的文件可安全删除）
        referenceCount:
          type: integer
          format: int64
          description: 引用它的内容记录条数
        references:
          type: array
          description: 引用来源明细；未引用时为空数组
          items:
            $ref: '#/components/schemas/ManageMediaReference'
        originName:
          type: string
          description: 上传时的原始文件名（元数据表登记值，未登记时为空）
        ext:
          type: string
        mime:
          type: string
        width:
          type: integer
        height:
          type: integer
    ManageMediaBatchDeleteInput:
      type: object
      description: 媒体库批量删除载荷；不存在的文件会被跳过（接口幂等），空集合或超过 200 个返回失败
      required:
        - names
      properties:
        names:
          type: array
          maxItems: 200
          items:
            type: string
      example:
        names:
          - 9f2c8b1d....png
    ManageMediaBatchDeleteResult:
      type: object
      description: 媒体批量删除结果
      required:
        - deleted
      properties:
        deleted:
          type: integer
          format: int64
          description: 实际删除的文件数
    ManageMediaDeleteResult:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
    ManageMediaReferencesResult:
      type: object
      description: 媒体文件引用统计
      required:
        - total
        - references
      properties:
        total:
          type: integer
          format: int64
          description: 引用该文件的（未软删除）内容记录条数总和
        references:
          type: array
          description: 按资源/字段拆分的明细；无引用时为空数组
          items:
            $ref: '#/components/schemas/ManageMediaReference'
    ManageBackupFile:
      type: object
      description: 备份文件
      required:
        - name
        - size
        - modTime
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        modTime:
          type: string
          description: 文件修改时间（RFC3339）
    ManageRestoreArchiveResult:
      type: object
      description: 备份包导入结果
      required:
        - restored
        - createdAt
      properties:
        restored:
          type: boolean
        createdAt:
          type: string
          description: 备份包生成时间（取自 manifest）
          example: '2026-03-01T12:00:00+08:00'
    ManageTokenResult:
      type: object
      description: 机器令牌读写结果
      required:
        - token
      properties:
        token:
          type: string
          description: 当前生效的令牌；空串表示未配置（对应接口整体拒绝请求）
    ManageTokenInput:
      type: object
      description: 机器令牌写入载荷
      required:
        - token
      properties:
        token:
          type: string
          description: 新令牌；空串表示清除（禁用对应接口）
    ManageEditHistoryMeta:
      type: object
      description: 历史版本摘要（不含快照）
      required:
        - seq
        - version
        - createdAt
        - summary
      properties:
        seq:
          type: integer
          description: 版本序号（同一资源内自增，从 1 开始）
        version:
          type: integer
          description: 该快照对应的内容 version
        createdAt:
          type: string
          description: 保存时间
        summary:
          type: string
          description: 变更摘要
    ManageEditHistoryDetail:
      description: 历史版本详情（含完整快照）
      allOf:
        - $ref: '#/components/schemas/ManageEditHistoryMeta'
        - type: object
          required:
            - snapshot
          properties:
            snapshot:
              description: 完整实体快照，结构与对应资源的管理端详情一致（含 tagIds）
              type: object
              additionalProperties: true
    PublishCategory:
      type: object
      description: 发布端可选分类
      required:
        - id
        - name
        - slug
        - scope
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          description: 写入内容时使用的 `categoryId` 值
        scope:
          $ref: '#/components/schemas/CategoryScope'
    PublishTag:
      type: object
      description: 发布端可选标签
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: 写入内容时使用的 `tagIds` 值
        name:
          type: string
    PublishLookupResult:
      type: object
      description: 发布状态查询结果
      required:
        - exists
        - id
        - title
        - slug
      properties:
        exists:
          type: boolean
          description: 是否存在（未删除的）同名内容
        id:
          type: string
          description: 已存在时为内容 ID，否则为空串
        title:
          type: string
          description: 已存在时为标题，否则为空串
        slug:
          type: string
          description: 查询用的 slug 原样回显
    UserCaptcha:
      type: object
      description: 图形验证码（算术题）
      required:
        - captchaId
        - captcha
      properties:
        captchaId:
          type: string
          description: 验证码 ID，登录时以 `captchaId` 回传
        captcha:
          type: string
          description: base64 图片数据（可直接作为 `<img src>`）
    UserLoginInput:
      type: object
      description: |
        登录请求。`account` 字段同时支持账号与邮箱（均唯一）。
        验证码是否必填取决于服务端 `captcha.enabled` 配置，因此 `captchaId` / `verifyCode`
        在结构上没有 required 约束，由服务层按配置校验。
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 6
          maxLength: 100
          description: 账号或邮箱
        password:
          type: string
          minLength: 6
          maxLength: 100
        captchaId:
          type: string
          maxLength: 100
          description: 验证码 ID，取自 `GET /api/user/captcha` 的 `captchaId`
        verifyCode:
          type: string
          maxLength: 100
          description: 用户输入的验证码答案（算术题结果）
    UserLoginResult:
      type: object
      description: 登录成功返回的当前用户
      required:
        - id
        - nickname
        - account
        - email
        - userType
        - userStatus
        - token
      properties:
        id:
          type: string
        nickname:
          type: string
        account:
          type: string
        email:
          type: string
        password:
          type: string
          description: 密码哈希（历史遗留字段，随模型一并返回）
        userType:
          type: integer
          description: 1 普通用户、2 管理员、100 超级管理员
          enum:
            - 1
            - 2
            - 100
        userStatus:
          type: integer
          description: 1 可用、2 不可用、3 未激活
        mobile:
          type: string
        avatar:
          type: string
        bio:
          type: string
        currentRoomId:
          type: string
        requirePwdReset:
          type: boolean
          description: 为 true 时前端登录后提醒一次修改密码（不拦截接口）
        token:
          type: string
          description: 后续请求的 X-Token
        createdAt:
          type: string
          format: date-time
          description: 注意：用户模块 BaseModel 的字段名与列名互换，createdAt 实际取自 updated_at 列
        updatedAt:
          type: string
          format: date-time
          description: 注意：实际取自 created_at 列
        deletedAt:
          description: 软删除时间；未删除时为 null
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    UserChangePwdInput:
      type: object
      description: 修改当前登录用户的密码，需要校验原密码
      required:
        - oldPassword
        - password
        - rePassword
      properties:
        oldPassword:
          type: string
          description: 原密码
        password:
          type: string
          minLength: 8
          maxLength: 16
          description: 新密码，8–16 位
        rePassword:
          type: string
          minLength: 8
          maxLength: 16
          description: 重复新密码，必须与 password 一致
  responses:
    BlogInternal:
      description: 服务内部错误（HTTP 500，code 50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 50000
            msg: 服务内部错误
            data: null
    BlogInvalidQuery:
      description: 查询参数格式错误（HTTP 400，code 40001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40001
            msg: 查询参数格式错误
            data: null
    BlogPostNotFound:
      description: 文章不存在或已被删除（HTTP 404，code 40401）；草稿与定时发布文章同样返回此错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40401
            msg: 文章不存在或已被删除
            data: null
    BlogDiaryNotFound:
      description: 日记不存在或已被删除（HTTP 404，code 40402）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40402
            msg: 日记不存在或已被删除
            data: null
    BlogPortfolioNotFound:
      description: 作品不存在或已移除（HTTP 404，code 40403）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40403
            msg: 作品不存在或已移除
            data: null
    BlogToolNotFound:
      description: 工具不存在，或该条目不是自研工具（HTTP 404，code 40404）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40404
            msg: 工具不存在，或该条目不是自研工具
            data: null
    ManageInvalidRequest:
      description: '请求参数格式错误（HTTP 400，code 40001）；字段级校验失败时 msg 为具体原因，且 data 为 {"field": "<字段名>"}'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type:
                      - object
                      - 'null'
                    description: '参数格式错误时为 null；字段级校验失败时为 {"field": "<字段名>"}'
                    properties:
                      field:
                        type: string
                        description: 出错的 JSON 字段名，仅字段级校验失败时存在
          examples:
            invalid:
              value:
                code: 40001
                msg: 请求参数格式错误
                data: null
            fieldError:
              value:
                code: 40001
                msg: 名称不能为空
                data:
                  field: name
    ManageUnauthorized:
      description: 未登录或登录已失效（HTTP 401，code 40100）；`X-Token` 缺失或无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40100
            msg: 未登录或登录已失效
            data: null
    ManageForbidden:
      description: 无管理权限（HTTP 403，code 40300）；要求 `userType` ∈ {2, 100}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40300
            msg: 无管理权限
            data: null
    ManageInternal:
      description: 服务内部错误（HTTP 500，code 50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 50000
            msg: 服务内部错误
            data: null
    ManageConflict:
      description: 版本冲突或标识重复（HTTP 409，code 40900）；`version` 过期或 slug / 标签名等唯一标识已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40900
            msg: 数据已变更或标识重复
            data: null
    ManageNotFound:
      description: 资源不存在（HTTP 404，code 40410）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40410
            msg: 资源不存在
            data: null
    ManageBadRequest:
      description: |
        请求参数错误（HTTP 400）。该端点的 400 有两种业务码：
        - `40001` 参数格式错误；字段级校验失败时 msg 为具体原因，data 为 `{"field": "<字段名>"}`；
        - `40002` 关联的分类或标签不存在，data 为 `{"field": "categoryId 或 tagIds"}`。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    description: '40001 时为 {"field": "..."} 或 null，40002 时为 {"field": "categoryId 或 tagIds"}'
                    type:
                      - object
                      - 'null'
                    properties:
                      field:
                        type: string
          examples:
            invalid:
              summary: 参数格式错误（40001）
              value:
                code: 40001
                msg: 请求参数格式错误
                data: null
            fieldError:
              summary: 字段级校验失败（40001）
              value:
                code: 40001
                msg: 标题不能为空
                data:
                  field: title
            referenceAbsent:
              summary: 关联的分类或标签不存在（40002）
              value:
                code: 40002
                msg: 关联的分类或标签不存在，请先创建
                data:
                  field: categoryId 或 tagIds
    ManageToolBadRequest:
      description: |
        请求参数错误（HTTP 400）。工具资源的 400 有三种业务码：
        - `40001` 参数格式错误 / 字段级校验失败（data 为 `{"field": "<字段名>"}`）；
        - `40003` 外链工具（`kind = link`）缺少有效地址，data.field = `url`；
        - `40004` 自研工具（`kind = own`）缺少开发状态，data.field = `developmentStatus`。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type:
                      - object
                      - 'null'
                    description: '参数格式错误时为 null；字段级校验失败时为 {"field": "<字段名>"}'
                    properties:
                      field:
                        type: string
          examples:
            invalid:
              summary: 参数格式错误（40001）
              value:
                code: 40001
                msg: 请求参数格式错误
                data: null
            urlRequired:
              summary: 外链工具缺少地址（40003）
              value:
                code: 40003
                msg: 外链工具必须填写有效地址（支持 http/https 等协议，不支持 javascript 这类可执行协议的地址）
                data:
                  field: url
            statusRequired:
              summary: 自研工具缺少开发状态（40004）
              value:
                code: 40004
                msg: 自研工具必须填写开发状态
                data:
                  field: developmentStatus
    RateLimited:
      description: |
        触发限流（HTTP 429）。仅作用于 `/api/user/login`（0.1/s，容量 5）、
        `/api/blog-mgr/uploads/`（0.5/s，容量 20）、`/api/publish`（0.2/s，容量 20），按客户端 IP 令牌桶计数。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 42900
            msg: 请求过于频繁，请稍后再试
            data: null
    PublishUnauthorized:
      description: 发布令牌未配置或无效（HTTP 401，code 40100）；请求头 `X-Publish-Token` 必须等于后台配置的发布令牌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          examples:
            missing:
              value:
                code: 40100
                msg: 未配置发布令牌
                data: null
            invalid:
              value:
                code: 40100
                msg: 发布令牌无效
                data: null
    PublishIPForbidden:
      description: 来源 IP 不在白名单内（HTTP 403，code 40300）；仅当配置了 `publish.allowIPs` 时校验
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40300
            msg: 来源 IP 不在白名单内
            data: null
    UserUnauthorized:
      description: 未登录或登录已失效（HTTP 401，code 1）；`X-Token` 缺失或已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          examples:
            missing:
              value:
                code: 1
                msg: 请先登录
                data: null
            invalid:
              value:
                code: 1
                msg: 认证失败，请重新登录
                data: null
    BackupUnauthorized:
      description: NAS 备份令牌未配置或无效（HTTP 401，code 40100）；请求头 `X-Backup-Token` 必须等于后台配置的备份令牌（回退配置文件 `[backup].apiToken`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          examples:
            missing:
              value:
                code: 40100
                msg: 未配置 NAS 备份令牌
                data: null
            invalid:
              value:
                code: 40100
                msg: NAS 备份令牌无效
                data: null
    BackupIPForbidden:
      description: 来源 IP 不在白名单内（HTTP 403，code 40300）；仅当配置了 `backup.allowIPs` 时校验
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40300
            msg: 来源 IP 不在白名单内
            data: null
  parameters:
    PublicPage:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PublicPageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    PublicSort:
      name: sort
      in: query
      required: false
      description: 排序方向，作用于发布日期（置顶项恒在最前）
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    PublicCategoryFilter:
      name: categoryId
      in: query
      required: false
      description: 分类 slug（取自 `GET /api/blog/categories` 的 `id`）
      schema:
        type: string
    PublicTagFilter:
      name: tag
      in: query
      required: false
      description: 标签 slug
      schema:
        type: string
    PublicKeyword:
      name: keyword
      in: query
      required: false
      description: 关键词，匹配标题与摘要
      schema:
        type: string
    PostID:
      name: id
      in: path
      required: true
      description: 文章 slug
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DiaryID:
      name: id
      in: path
      required: true
      description: 日记 publicId
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PortfolioItemID:
      name: id
      in: path
      required: true
      description: 作品 slug
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ToolID:
      name: id
      in: path
      required: true
      description: 工具 slug
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ManagePage:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    ManagePageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ManageKeyword:
      name: keyword
      in: query
      required: false
      description: 关键词模糊搜索
      schema:
        type: string
    ManageScope:
      name: scope
      in: query
      required: false
      description: 按分类适用范围过滤（categories 列表与发布端分类列表使用）
      schema:
        type: string
        enum:
          - post
          - portfolio
          - bookmark
    ManageDeleted:
      name: deleted
      in: query
      required: false
      description: 回收站过滤：`exclude` 排除已删除、`only` 仅已删除、`all` 全部
      schema:
        type: string
        enum:
          - exclude
          - only
          - all
        default: exclude
    ManageSort:
      name: sort
      in: query
      required: false
      description: 排序方向，作用于创建时间
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    ManageID:
      name: id
      in: path
      required: true
      description: 资源 ID（雪花 ID）
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ManageStatus:
      name: status
      in: query
      required: false
      description: 按发布状态过滤；留空表示全部
      schema:
        type: string
        enum:
          - draft
          - published
          - archived
    ManageCategoryFilter:
      name: categoryId
      in: query
      required: false
      description: 分类 slug
      schema:
        type: string
    VisitorDays:
      name: days
      in: query
      required: false
      description: 统计最近多少天
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 7
    MediaRefFilter:
      name: ref
      in: query
      required: false
      description: 按引用状态过滤：`all` 全部、`referenced` 仅被引用、`unreferenced` 仅未引用
      schema:
        type: string
        enum:
          - all
          - referenced
          - unreferenced
        default: all
    MediaName:
      name: name
      in: path
      required: true
      description: 媒体文件名（`<sha256>.<ext>`，不含路径分隔符）
      schema:
        type: string
        minLength: 1
        maxLength: 255
    BackupName:
      name: name
      in: path
      required: true
      description: 备份文件名（不含路径分隔符）
      schema:
        type: string
        minLength: 1
        maxLength: 255
    HistoryResource:
      name: resource
      in: path
      required: true
      description: 资源标识，仅 `posts` 与 `diaries` 有编辑历史
      schema:
        type: string
        enum:
          - posts
          - diaries
    HistoryRefID:
      name: id
      in: path
      required: true
      description: 资源 ID（雪花 ID）
      schema:
        type: string
        minLength: 1
        maxLength: 128
    HistorySeq:
      name: seq
      in: path
      required: true
      description: 历史版本序号（从 1 开始）
      schema:
        type: integer
        minimum: 1
    PublishSlug:
      name: slug
      in: path
      required: true
      description: 文章 slug（diaries 为 publicId）
      schema:
        type: string
        minLength: 1
        maxLength: 128
