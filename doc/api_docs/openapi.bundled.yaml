        - $ref: '#/components/parameters/MediaRefFilter'
      responses:
        '200':
          description: |
            成功时 code 为 0、data 为文件数组（无文件或上传目录不存在时为空数组）；失败时 code 为 1、msg 为具体原因
            （如「读取上传目录失败」「扫描内容引用失败」「读取媒体元数据失败」）、data 为 {}。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
