  /api/blog-mgr/medias/{name}:
    delete:
      operationId: deleteManageMedia
      tags:
        - blog-manage
      summary: 删除单个媒体文件
      description: |
        **物理删除磁盘文件**（不可恢复），同时清理元数据表登记。

        `name` 必须是上传目录下的普通文件名（不含路径分隔符，长度 ≤ 255），否则返回「文件名不合法」；
        文件不存在（或不是普通文件）返回「文件不存在」。

        与其他媒体删除接口一样，**删除文件不会回写引用它的内容行**——内容里会保留失效的 `/files/...` 字符串，
        由前端降级为占位图；删除前可先用 `GET /api/blog-mgr/medias/{name}/references` 查看引用情况。
      security:
        - XToken: []
      parameters:
        - $ref: '#/components/parameters/MediaName'
      responses:
        '200':
          description: |
            成功时 code 为 0、data.deleted 为 true；失败时 code 为 1、msg 为具体原因（如「文件名不合法」「文件不存在」
            「删除失败」）、data 为 {}。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ManageMediaDeleteResult'
                          - $ref: '#/components/schemas/EmptyData'
              examples:
                success:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      deleted: true
                failure:
                  value:
                    code: 1
                    msg: 文件不存在
                    data: {}
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
          $ref: '#/components/responses/ManageForbidden'
  /api/blog-mgr/medias/{name}/references:
    get:
      operationId: getManageMediaReferences
      tags:
        - blog-manage
      summary: 查询媒体文件的引用情况
      description: |
        删除前用于提示破坏性影响：统计该文件名被多少条**未软删除**的内容记录引用，并按资源与字段拆分
        （例如「文章 / 正文」「作品 / 封面」「关于我 / 头像」）。统计方式是按文件名做包含匹配，覆盖封面、
        图标、头像、图集、JSON 设置与 Markdown 正文等所有引用形式。

        `name` 必须是上传目录下的普通文件名（不含路径分隔符），否则返回「文件名不合法」。无引用时
        `references` 为空数组、`total` 为 0。
      security:
        - XToken: []
      parameters:
        - $ref: '#/components/parameters/MediaName'
      responses:
        '200':
          description: |
            成功时 code 为 0、data 为引用统计；失败时 code 为 1、msg 为具体原因（如「文件名不合法」「查询引用失败」）、
            data 为 {}。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ManageMediaReferencesResult'
                          - $ref: '#/components/schemas/EmptyData'
              examples:
                success:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      total: 3
                      references:
                        - resource: 文章
                          field: 正文
                          count: 2
                        - resource: 作品
                          field: 封面
                          count: 1
                empty:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      total: 0
                      references: []
                failure:
                  value:
                    code: 1
                    msg: 文件名不合法
                    data: {}
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
          $ref: '#/components/responses/ManageForbidden'
  /api/blog-mgr/backups:
    get:
      operationId: listManageBackups
      tags:
        - blog-manage
      summary: 备份文件列表
      description: |
        列出备份目录（配置项 `[backup].dir`，默认 `backup`）下的文件（跳过子目录），按文件修改时间**倒序**。

        仅 SQLite 驱动支持备份：PostgreSQL 等其它驱动下返回失败（msg「仅 SQLite 驱动支持备份」）。
        备份目录不存在时返回空数组而非报错。
      security:
        - XToken: []
      responses:
        '200':
          description: |
            成功时 code 为 0、data 为备份文件数组（目录不存在或无文件时为空数组）；失败时 code 为 1、
            msg 为具体原因（如「仅 SQLite 驱动支持备份」「读取备份目录失败」）、data 为 {}（该模块沿用
            「失败也返回 HTTP 200」的早期约定）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            items:
                              $ref: '#/components/schemas/ManageBackupFile'
                          - $ref: '#/components/schemas/EmptyData'
              examples:
                success:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      - name: backup-2026-09-24-101500.db
                        size: 524288
                        modTime: '2026-09-24T10:15:00+08:00'
                      - name: backup-2026-09-19-030000.db.gz
                        size: 118274
                        modTime: '2026-09-19T03:00:00+08:00'
                empty:
                  value:
                    code: 0
                    msg: 操作成功
                    data: []
                failure:
                  value:
                    code: 1
                    msg: 仅 SQLite 驱动支持备份
                    data: {}
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
          $ref: '#/components/responses/ManageForbidden'
    post:
      operationId: createManageBackup
      tags:
        - blog-manage
      summary: 立即执行一次数据库备份
      description: |
        立即执行一次 SQLite 在线备份并返回备份文件名、大小与修改时间。是否压缩由配置项 `[backup].compress`
        控制（压缩后文件扩展名为 `.gz`）。

        仅 SQLite 驱动支持备份：其它驱动下返回失败（msg「仅 SQLite 驱动支持备份」）。
      security:
        - XToken: []
      responses:
        '200':
          description: |
            成功时 code 为 0、data 为新建备份文件信息；失败时 code 为 1、msg 为具体原因（如「仅 SQLite 驱动支持备份」
            或备份过程返回的错误）、data 为 {}（该模块沿用「失败也返回 HTTP 200」的早期约定）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ManageBackupFile'
                          - $ref: '#/components/schemas/EmptyData'
              examples:
                success:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      name: backup-2026-09-24-101500.db
                      size: 524288
                      modTime: '2026-09-24T10:15:00+08:00'
                failure:
                  value:
                    code: 1
                    msg: 仅 SQLite 驱动支持备份
                    data: {}
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
          $ref: '#/components/responses/ManageForbidden'
  /api/blog-mgr/backups/export:
