        空数组的 `techStack` / `milestones`、默认 `home` / `footer` / `banner`），不会返回 404。

        `modules` 的 `id` 是固定枚举，历史数据中缺失的模块会按默认配置补齐。
      security:
        - XToken: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicSite'
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
