                            items:
                              $ref: '#/components/schemas/ManageMediaFile'
                          - $ref: '#/components/schemas/EmptyData'
              examples:
                success:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      - name: 9f2c8b1d6e4a0f3c5d7b9a1e2f4c6d8b0a2c4e6f8a1b3d5c7e9f0a2b4c6d8e1f.png
                        path: /files/blog/9f2c8b1d6e4a0f3c5d7b9a1e2f4c6d8b0a2c4e6f8a1b3d5c7e9f0a2b4c6d8e1f.png
                        size: 182734
                        modTime: '2026-09-20T14:32:05+08:00'
                        referenced: true
                        referenceCount: 2
                        references:
                          - resource: 文章
                            field: 正文
                            count: 1
                          - resource: 作品
