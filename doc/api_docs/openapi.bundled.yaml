          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ManageEditHistoryMeta'
        '400':
          $ref: '#/components/responses/ManageInvalidRequest'
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
          $ref: '#/components/responses/ManageForbidden'
        '500':
          $ref: '#/components/responses/ManageInternal'
  /api/blog-mgr/history/{resource}/{id}/{seq}:
    get:
      operationId: getManageHistory
      tags:
        - blog-manage
      summary: 历史版本详情（含完整快照）
      description: |
        读取指定历史版本的**完整快照**。`snapshot` 是当时保存的完整实体快照，结构与对应资源的管理端详情一致
        （含 `tagIds`），可直接用于对比或恢复。

        仅 `posts` 与 `diaries` 有编辑历史；`resource` 传其他值、`id` 非法或 `seq` 小于 1 返回 400，
        `seq` 非整数同样返回 400；该版本不存在返回 404。
      security:
        - XToken: []
      parameters:
        - $ref: '#/components/parameters/HistoryResource'
        - $ref: '#/components/parameters/HistoryRefID'
        - $ref: '#/components/parameters/HistorySeq'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
