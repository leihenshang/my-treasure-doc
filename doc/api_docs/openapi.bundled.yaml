openapi: 3.1.0
info:
  title: Treasure Doc API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Treasure Doc（个人博客 + 后台管理）的 HTTP API 规格。

    ## 文件组织
    本仓库的 API 规格采用「**一个端点一个文件**」的组织方式：

    - `openapi.yaml`（本文件）：聚合根。只声明 `info` / `servers` / `tags` / `security` 与全部 `paths`，
      每个 operation（`get` / `post` / `put` / `patch` / `delete`）通过 $ref 指向对应端点文件。
    - `blog/`（21 个）：公开只读博客 API `/api/blog/*` 与站点根 `robots.txt` / `sitemap.xml` / `rss.xml`。
    - `blog-mgr/`（80 个）：后台管理 API `/api/blog-mgr/*`（含 `/resources/<资源>/` 子目录、备份、媒体库、编辑历史）。
    - `publish/`（12 个）：机器令牌发布 API `/api/publish/*`。
    - `user/`（5 个）：鉴权 API `/api/user/*` 与健康检查 `/ping`。
    - `backup/`（1 个）：NAS 机器令牌导出 `/api/backup/export`。
    - `components/`：跨端点共享的 `schemas`、`responses`、`parameters`，端点文件用相对路径引用。

    端点文件的内容是一个 **operation 对象**（不含 `openapi:` / `paths:` 包装），首行注释写明
    「HTTP 方法 + 完整路径 + 所属模块 + 路由注册位置」。

    ## 解析方式
    这是「subdocuments」风格的多文件规格，**不能**被 Swagger UI 直接加载，需先打包：

    ```bash
    npx @redocly/cli bundle doc/api_docs/openapi.yaml -o /tmp/openapi.bundled.yaml
    ```

    然后即可用 Swagger UI / Redoc / `npx @redocly/cli preview-docs doc/api_docs/openapi.yaml` 浏览。

    ## 统一响应约定
    - 除 `GET /ping` 与站点根三个文件外，所有接口都返回 `{code, msg, data}` 信封。
    - 业务成功与失败通常都返回 HTTP 200，靠 `code` 区分（`0` = 成功）；
      认证/权限/限流中间件则返回真实的 401 / 403 / 429。
    - 内容资源更新使用 `version` 乐观锁：PATCH/PUT 必须回传当前 `version`，过期返回 409 / code 40900。

    ## 鉴权
    | 请求头 | 适用接口 | 说明 |
    | --- | --- | --- |
    | `X-Token` | `/api/blog-mgr/*`、`POST /api/user/logout`、`POST /api/user/change-pwd` | 登录后签发；后台还要求 `userType` ∈ {2, 100} |
    | `X-Publish-Token` | `/api/publish/*` | 机器令牌，后台配置；创建即发布 |
    | `X-Backup-Token` | `/api/backup/export` | NAS 机器令牌，后台配置 |

    跨域（CORS）由前置反向代理统一处理，Go 侧不设置任何 `Access-Control-*` 响应头。
servers:
  - url: http://127.0.0.1:2026
    description: 本地开发（与 `module/user/config.example.toml` 的 `app.port` 一致）
  - url: /
    description: 同源部署（前端静态资源由同一进程托管）
security:
  - {}
tags:
  - name: public-blog
    description: 公开只读博客 API（`/api/blog/*`）。仅返回 `publish_status = published` 且 `published_at <= now` 的内容，草稿与定时文章对公众 404。
  - name: site-files
    description: 站点根级机器可读文件（`robots.txt` / `sitemap.xml` / `rss.xml`），非 JSON 信封响应。
  - name: blog-manage
    description: 后台管理 API（`/api/blog-mgr/*`）。需 `X-Token` 且 `userType` ∈ {2, 100}（管理员 / 超级管理员）。
  - name: publish
    description: 机器令牌发布 API（`/api/publish/*`）。需 `X-Publish-Token`，创建即发布（强制 `publishStatus = published`），可叠加 IP 白名单。
  - name: user
    description: 用户鉴权 API（`/api/user/*`）与健康检查。
  - name: backup
    description: NAS 机器令牌备份导出（`/api/backup/export`），只读。
paths:
  /ping:
    get:
      operationId: ping
      tags:
        - user
      summary: 健康检查
      description: |
        最轻量的存活探针：不查库、不走统一响应信封，直接返回 `{"msg":"pong!"}`。

        适合负载均衡 / 容器健康检查的高频调用。
      security:
        - {}
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - msg
                properties:
                  msg:
                    type: string
                    example: pong!
  /robots.txt:
    get:
      operationId: getRobotsTxt
      tags:
        - site-files
      summary: 站点 robots.txt
      description: |
        返回 robots.txt 明文：允许全部爬虫抓取，并声明本站 sitemap 地址
        （`Sitemap: <站点根>/sitemap.xml`，站点根按请求 Host 与 `X-Forwarded-Proto` 推断）。
        该端点不返回 JSON 信封，直接输出 `text/plain`。
      responses:
        '200':
          description: robots.txt 明文，指向本站 sitemap
          content:
            text/plain:
              schema:
                type: string
              example: |
                User-agent: *
                Allow: /
                Sitemap: https://example.com/sitemap.xml
  /sitemap.xml:
    get:
      operationId: getSitemapXml
      tags:
        - site-files
      summary: 站点 sitemap.xml
      description: |
        返回 sitemap urlset XML（命名空间 `http://www.sitemaps.org/schemas/sitemap/0.9`），
        收录静态页面以及全部已发布文章、日记与作品（草稿、归档、定时发布的内容不收录），
        条目 `loc` 由请求 Host 推断的站点根拼接。

        成功时直接输出 `application/xml`；服务内部错误时返回 JSON 信封
        `{code: 50000, msg: "服务内部错误", data: null}`。
      responses:
        '200':
          description: sitemap urlset XML
          content:
            application/xml:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/BlogInternal'
  /rss.xml:
    get:
      operationId: getRssFeed
      tags:
        - site-files
      summary: 站点 RSS 订阅源
      description: |
        返回 RSS 2.0 feed，最多包含 50 篇最新已发布文章（按发布日期倒序），
        频道标题与描述取自站点设置（`name` 与 `intro`），条目链接指向前端文章详情页。

        成功时直接输出 `application/xml`；服务内部错误时返回 JSON 信封
        `{code: 50000, msg: "服务内部错误", data: null}`。
      responses:
        '200':
          description: RSS 2.0 feed
          content:
            application/xml:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/categories:
    get:
      operationId: listBlogCategories
      tags:
        - public-blog
      summary: 文章分类列表
      description: |
        仅返回「已启用」且至少有一篇已发布文章的分类（scope = post），按 `sortOrder` 升序。
        `id` 即分类 slug，可直接用作文章列表的 `categoryId` 过滤值，也是前端 `/Blog/Category/:slug` 的路径。
      security:
        - {}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicCategory'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/tags:
    get:
      operationId: listBlogTags
      tags:
        - public-blog
      summary: 文章标签列表
      description: |
        仅返回被至少一篇已发布文章引用的标签，按标签名升序，用于文章列表页的标签筛选。
      security:
        - {}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicTag'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/posts:
    get:
      operationId: listBlogPosts
      tags:
        - public-blog
      summary: 文章列表（分页）
      description: |
        公开文章列表，仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的文章；
        置顶文章恒排在前面，其余按发布日期按 `sort` 方向排序。列表不返回正文。

        响应 `list` 中 `tags` 与 `related` 等数组字段保证为空数组而非 null。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicPage'
        - $ref: '#/components/parameters/PublicPageSize'
        - $ref: '#/components/parameters/PublicSort'
        - $ref: '#/components/parameters/PublicCategoryFilter'
        - $ref: '#/components/parameters/PublicTagFilter'
        - $ref: '#/components/parameters/PublicKeyword'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicPostPage'
        '400':
          $ref: '#/components/responses/BlogInvalidQuery'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/posts/{id}:
    get:
      operationId: getBlogPost
      tags:
        - public-blog
      summary: 文章详情（路径参数为文章 slug）
      description: |
        按文章 slug 返回详情，含 Markdown 正文、上下篇与同分类/同标签的推荐文章。
        仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的文章，
        草稿、归档、定时发布的文章一律按不存在处理（404）。

        `id` 是文章 slug 而非数据库 ID；每次访问会自增浏览量。
        响应中 `tags` / `related` 等数组字段保证为空数组而非 null。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/PostID'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicPost'
        '400':
          $ref: '#/components/responses/BlogInvalidQuery'
        '404':
          $ref: '#/components/responses/BlogPostNotFound'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/archive:
    get:
      operationId: listBlogArchive
      tags:
        - public-blog
      summary: 文章归档（按月份分组）
      description: |
        仅统计已发布文章，按发布月份（`YYYY-MM`）聚合并按月份倒序返回，供归档页展示。
        组内文章按发布日期倒序；每组 `posts` 与文章摘要一致，数组字段保证为空数组而非 null。
      security:
        - {}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicArchiveGroup'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/diary/tags:
    get:
      operationId: listBlogDiaryTags
      tags:
        - public-blog
      summary: 日记标签列表
      description: |
        仅返回被至少一篇已发布日记引用的标签，按标签名升序，用于日记列表页的标签筛选。
      security:
        - {}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicTag'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/diaries:
    get:
      operationId: listBlogDiaries
      tags:
        - public-blog
      summary: 日记列表（分页）
      description: |
        公开日记列表，仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的日记；
        置顶日记恒排在前面，其余按发布日期按 `sort` 方向排序。列表不返回正文。

        响应 `list` 中 `tags` 数组保证为空数组而非 null。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicPage'
        - $ref: '#/components/parameters/PublicPageSize'
        - $ref: '#/components/parameters/PublicSort'
        - $ref: '#/components/parameters/PublicTagFilter'
        - $ref: '#/components/parameters/PublicKeyword'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicDiaryPage'
        '400':
          $ref: '#/components/responses/BlogInvalidQuery'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/diaries/{id}:
    get:
      operationId: getBlogDiary
      tags:
        - public-blog
      summary: 日记详情（路径参数为日记 publicId）
      description: |
        按日记 publicId 返回详情，含 Markdown 正文。
        仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的日记，
        草稿、归档、定时发布的日记一律按不存在处理（404）。

        `id` 是日记的 publicId，而非数据库 ID；每次访问会自增浏览量。
        响应中 `tags` 数组保证为空数组而非 null。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/DiaryID'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicDiary'
        '400':
          $ref: '#/components/responses/BlogInvalidQuery'
        '404':
          $ref: '#/components/responses/BlogDiaryNotFound'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/portfolio/categories:
    get:
      operationId: listBlogPortfolioCategories
      tags:
        - public-blog
      summary: 作品分类列表
      description: |
        仅返回「已启用」且至少有一个已发布作品（scope = portfolio）的分类，按 `sortOrder` 升序。
        `id` 即分类 slug，可直接用作作品列表的 `categoryId` 过滤值。
      security:
        - {}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicCategory'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/portfolio/items:
    get:
      operationId: listBlogPortfolioItems
      tags:
        - public-blog
      summary: 作品列表
      description: |
        公开作品列表，仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的作品，
        按发布日期倒序（同日期按 slug 升序），不返回正文与图集。整表返回、无分页。

        `techStack` 数组保证为空数组而非 null。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicCategoryFilter'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicPortfolioSummary'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/portfolio/items/{id}:
    get:
      operationId: getBlogPortfolioItem
      tags:
        - public-blog
      summary: 作品详情（路径参数为作品 slug）
      description: |
        按作品 slug 返回详情，含 Markdown 正文、相关链接、图集与成果指标。
        仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的作品，
        草稿、归档、定时发布的作品一律按不存在处理（404）。

        `id` 是作品 slug；每次访问会自增浏览量。
        `techStack` / `links` / `gallery` / `metrics` 数组保证为空数组而非 null。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/PortfolioItemID'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicPortfolioItem'
        '400':
          $ref: '#/components/responses/BlogInvalidQuery'
        '404':
          $ref: '#/components/responses/BlogPortfolioNotFound'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/tools:
    get:
      operationId: listBlogTools
      tags:
        - public-blog
      summary: 工具列表
      description: |
        返回全部已发布工具，按 `sortOrder` 升序（同序按 slug 升序）。整表返回、无分页。
        列表不返回正文：自研工具（`type = own`）只给 `cover` 与 `status`，
        外链工具（`type = link`）只给 `url`。
      security:
        - {}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicTool'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/tools/{id}:
    get:
      operationId: getBlogTool
      tags:
        - public-blog
      summary: 工具详情（路径参数为工具 slug，仅自研工具）
      description: |
        按工具 slug 查询，且仅当该条目是自研工具（`kind = own`）且已发布时返回，
        内容包含 Markdown 正文。外链工具（`kind = link`）没有详情页，同样返回 404。

        仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的工具。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/ToolID'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicTool'
        '400':
          $ref: '#/components/responses/BlogInvalidQuery'
        '404':
          $ref: '#/components/responses/BlogToolNotFound'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/bookmark/categories:
    get:
      operationId: listBlogBookmarkCategories
      tags:
        - public-blog
      summary: 书签分类列表
      description: |
        仅返回「已启用」且至少有一条已发布书签（scope = bookmark）的分类，按 `sortOrder` 升序。
        `id` 即分类 slug，可直接用作书签列表的 `categoryId` 过滤值。
      security:
        - {}
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicCategory'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/bookmarks:
    get:
      operationId: listBlogBookmarks
      tags:
        - public-blog
      summary: 收藏集/书签列表
      description: |
        仅返回 `publishStatus = published` 且 `publishedAt <= 当前时间` 的书签，
        按 `sortOrder` 升序（同序按标题升序）。整表返回、无分页。

        `keyword` 匹配标题、描述、地址与标签名。响应 `tags` 数组保证为空数组而非 null。
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/PublicCategoryFilter'
        - $ref: '#/components/parameters/PublicKeyword'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicBookmark'
        '500':
          $ref: '#/components/responses/BlogInternal'
  /api/blog/profile:
    get:
      operationId: getBlogProfile
      tags:
        - public-blog
      summary: 个人资料（关于我）
      description: |
        返回「关于我」页所需的个人资料：姓名、头像、角色、所在地、座右铭、简介、联系方式与技能。
        未配置时返回空资料（`links` 与 `skills` 为空数组，绝不返回 null）。

        注意：该端点位于公开博客路由组内，按相邻公开端点的约定标注为无鉴权访问。
      security:
        - {}
