        '403':
          $ref: '#/components/responses/ManageForbidden'
        '500':
          $ref: '#/components/responses/ManageInternal'
  /api/blog-mgr/uploads/images:
    post:
      operationId: uploadManageImages
      tags:
        - blog-manage
      summary: 上传单张图片（封面 / 宣传图）
      description: |
        用于封面、主页宣传图等单图场景。表单字段名是 `file`，单个文件，**上限 8MB**。

        允许的类型按**文件内容嗅探**判定：JPEG / PNG / GIF / WebP / BMP；内容完全无法识别
        （`application/octet-stream`）时按文件名后缀兜底，兜底结果仍须命中上述白名单，其余情况返回
        「不支持的文件格式」。

        文件按内容 sha256 命名存入 `files/blog/`，返回 `/files/blog/<sha256>.<ext>`。相同内容重复上传会复用已有
        文件（服务端不重复写盘），并把文件登记进媒体元数据表。

        **限流**：该路径受令牌桶限流（0.5 次/秒，容量 20，按客户端 IP），超限返回 HTTP 429（见 429 响应）。
      security:
        - XToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 待上传的图片文件（上限 8MB）
            encoding:
              file:
                contentType: image/png, image/jpeg, image/gif, image/webp, image/bmp
      responses:
        '200':
          description: |
            成功时 code 为 0、data 为上传结果；失败时 code 为 1、msg 为具体原因（如「请选择图片文件」「不支持的文件格式」
            「文件大小不能超过 8MB」）、data 为 {}（该模块沿用「失败也返回 HTTP 200」的早期约定）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ManageUploadedImage'
                          - $ref: '#/components/schemas/EmptyData'
              examples:
                success:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      path: /files/blog/9f2c8b1d6e4a0f3c5d7b9a1e2f4c6d8b0a2c4e6f8a1b3d5c7e9f0a2b4c6d8e1f.png
                failure:
                  value:
                    code: 1
                    msg: 请选择图片文件
                    data: {}
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
          $ref: '#/components/responses/ManageForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/blog-mgr/uploads/medias:
    post:
      operationId: uploadManageMedias
      tags:
        - blog-manage
      summary: 批量上传图片 / 视频（Markdown 编辑器）
      description: |
        供 Markdown 编辑器一次提交多个图片/视频。单次最多 **10 个**文件（超限返回「一次最多上传 10 个文件」），
        单个文件**上限 50MB**。表单主字段是 `files`，同时兼容旧客户端的单数字段 `file`（可选，`files` 为空时回退使用）。

        类型同样按**文件内容嗅探**判定（图片 JPEG / PNG / GIF / WebP / BMP，视频 MP4 / WebM / MOV / AVI / MKV / MPEG）；
        内容完全无法识别时按文件名后缀兜底，兜底结果仍须命中白名单。

        返回的 `list` **顺序与提交顺序一致**。文件按内容 sha256 命名存入 `files/blog/`，返回
        `/files/blog/<sha256>.<ext>`；相同内容重复上传会复用已有文件（`existed: true`，服务端不重复写盘），
        并登记进媒体元数据表。**任一文件失败则整体返回失败**，msg 会带上出错的文件名（形如 `[a.png]文件大小不能超过 50MB`）。

        **限流**：该路径受令牌桶限流（0.5 次/秒，容量 20，按客户端 IP），超限返回 HTTP 429（见 429 响应）。
      security:
        - XToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                  description: 待上传的图片 / 视频文件（单次最多 10 个，单个上限 50MB）
                file:
                  type: string
                  format: binary
                  description: 兼容旧客户端的单文件字段；`files` 为空时回退使用该字段（可选）
            encoding:
              files:
                contentType: image/png, image/jpeg, image/gif, image/webp, image/bmp, video/mp4, video/webm, video/quicktime, video/x-msvideo, video/x-matroska, video/mpeg
      responses:
        '200':
          description: |
            成功时 code 为 0、data 为 `{list:[...]}`（顺序与提交顺序一致）；失败时 code 为 1、msg 为具体原因
            （如「请选择要上传的文件」「一次最多上传 10 个文件」「[文件名]不支持的文件格式」）、data 为 {}。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ManageUploadMediaList'
                          - $ref: '#/components/schemas/EmptyData'
              examples:
                success:
                  value:
                    code: 0
                    msg: 操作成功
                    data:
                      list:
                        - path: /files/blog/9f2c8b1d6e4a0f3c5d7b9a1e2f4c6d8b0a2c4e6f8a1b3d5c7e9f0a2b4c6d8e1f.png
                          name: 9f2c8b1d6e4a0f3c5d7b9a1e2f4c6d8b0a2c4e6f8a1b3d5c7e9f0a2b4c6d8e1f.png
                          size: 182734
                          existed: false
                        - path: /files/blog/1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809.mp4
                          name: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809.mp4
                          size: 5242880
                          existed: true
                failure:
                  value:
                    code: 1
                    msg: '[a.png]文件大小不能超过 50MB'
                    data: {}
        '401':
          $ref: '#/components/responses/ManageUnauthorized'
        '403':
          $ref: '#/components/responses/ManageForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/blog-mgr/medias:
    get:
      operationId: listManageMedias
      tags:
        - blog-manage
      summary: 媒体库文件列表
      description: |
        列出 `/files/blog/` 下的全部上传文件，按文件修改时间**倒序**。上传目录不存在时返回空数组而非报错。

        每个文件都标注是否被内容引用（`referenced`）、引用它的内容记录条数（`referenceCount`）与来源明细
        （`references`，按资源/字段拆分）。引用统计通过**一次性扫描**内容的封面 / 图标 / 头像 / 图集 / JSON 设置
        与 Markdown 正文得出，只统计未软删除的记录。

        `ref` 参数可只筛选已引用 / 未引用的文件（缺省 `all`）。
      security:
        - XToken: []
