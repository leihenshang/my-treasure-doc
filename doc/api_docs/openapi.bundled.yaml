        - blog-manage
      summary: 保存个人资料设置
      description: |
        整份覆盖保存个人资料，返回保存后的对象。违反以下任一条校验即返回 400 / code 40001：

        - `name` 去空格后不能为空；
        - 每条 `links` 的 `label` 不能为空，且 `label` 在同一份载荷内不能重复；单条 `url` 长度不超过 500 字符
          （不限制协议，手机号 / 微信号等纯文本同样合法）；
        - 每条 `skills` 的 `name`、`group` 不能为空，`level` 必须在 0–100。
      security:
        - XToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProfile'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicProfile'
        '400':
