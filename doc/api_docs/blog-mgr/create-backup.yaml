# POST /api/blog-mgr/backups —— 后台管理 API（立即执行一次数据库备份）
# 注册位置：module/blog_mgr/router/router.go → RegisterService（Handler 实现在 module/user/api/）
operationId: createManageBackup
tags: [blog-manage]
summary: 立即执行一次数据库备份
description: |
  立即执行一次 SQLite 在线备份并返回备份文件名、大小与修改时间。是否压缩由配置项 `[backup].compress`
  控制（压缩后文件扩展名为 `.gz`）。

  仅 SQLite 驱动支持备份：其它驱动下返回失败（msg「仅 SQLite 驱动支持备份」）。
security:
  - XToken: []
responses:
  '200':
    description: |
      成功时 code 为 0、data 为新建备份文件信息；失败时 code 为 1、msg 为具体原因（如「仅 SQLite 驱动支持备份」
      或备份过程返回的错误）、data 为 {}（该模块沿用「失败也返回 HTTP 200」的早期约定）。
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/ManageBackupFile'
        examples:
          success:
            value:
              code: 0
              msg: 操作成功
              data:
                name: backup-2026-09-24-101500.db
                size: 524288
                modTime: '2026-09-24T10:15:00+08:00'
          failure:
            value:
              code: 1
              msg: 仅 SQLite 驱动支持备份
              data: {}
  '401':
    $ref: '../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../components/responses.yaml#/ManageForbidden'