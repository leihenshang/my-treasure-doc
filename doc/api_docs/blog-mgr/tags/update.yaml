# PATCH /api/blog-mgr/tags/{id} —— 后台管理 API（更新标签）
# 注册位置：module/blog_mgr/router/router.go → RegisterService → 循环注册同一套泛化 Handler
operationId: updateManageTags
tags: [blog-manage]
summary: 更新标签
description: |
  标签没有 `version` 字段，不使用乐观锁，请求体不需要携带 `version`。

  `name` 归一化后（大小写不敏感）必须全局唯一，重复返回 409 / code 40900。
security:
  - XToken: []
parameters:
  - $ref: '../../components/parameters.yaml#/ManageID'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/ManageTagInput'
responses:
  '200':
    description: 更新成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../../components/schemas.yaml#/ManageTag'
  '400':
    $ref: '../../components/responses.yaml#/ManageInvalidRequest'
  '401':
    $ref: '../../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../../components/responses.yaml#/ManageForbidden'
  '404':
    $ref: '../../components/responses.yaml#/ManageNotFound'
  '409':
    $ref: '../../components/responses.yaml#/ManageConflict'
  '500':
    $ref: '../../components/responses.yaml#/ManageInternal'