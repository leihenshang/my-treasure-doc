# PATCH /api/blog-mgr/bookmarks/{id}/fields —— 后台管理 API（快捷修改收藏集条目字段）
# 注册位置：module/blog_mgr/router/router.go → RegisterService → 循环注册同一套泛化 Handler
operationId: updateManageBookmarksFields
tags: [blog-manage]
summary: 快捷修改收藏集条目字段
description: |
  列表快捷修改，白名单字段只有 `publishStatus`；提交 `pinned` 或其他白名单之外的字段返回 400 / code 40001
  （`data.field` 为 `pinned` 或 `fields`）。

  该接口**不要求** `version`，成功后服务端自行自增 `version`；回收站中的记录不允许快捷修改（返回 404）。
security:
  - XToken: []
parameters:
  - $ref: '../../components/parameters.yaml#/ManageID'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/ManageUpdateFieldsInput'
responses:
  '200':
    description: 修改成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../../components/schemas.yaml#/ManageBookmark'
  '400':
    $ref: '../../components/responses.yaml#/ManageInvalidRequest'
  '401':
    $ref: '../../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../../components/responses.yaml#/ManageForbidden'
  '404':
    $ref: '../../components/responses.yaml#/ManageNotFound'
  '500':
    $ref: '../../components/responses.yaml#/ManageInternal'