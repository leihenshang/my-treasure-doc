# PATCH /api/blog-mgr/bookmarks/{id} —— 后台管理 API（更新收藏集条目）
# 注册位置：module/blog_mgr/router/router.go → RegisterService → 循环注册同一套泛化 Handler
operationId: updateManageBookmarks
tags: [blog-manage]
summary: 更新收藏集条目
description: |
  乐观锁：请求体必须携带当前 `version`（取自详情响应），服务端按 `version` 匹配更新并自增，
  缺失或版本过期返回 409 / code 40900；更新成功后须重新拉取详情以刷新 `version`。

  关联校验：非空 `categoryId` 必须是 `scope = bookmark` 下已存在的分类，`tagIds` 必须全部存在，
  不满足时返回 400 / code 40002（`data.field` 为 `categoryId 或 tagIds`）。
security:
  - XToken: []
parameters:
  - $ref: '../../components/parameters.yaml#/ManageID'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/ManageBookmarkInput'
responses:
  '200':
    description: 更新成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../../components/schemas.yaml#/ManageBookmark'
  '400':
    $ref: '../../components/responses.yaml#/ManageBadRequest'
  '401':
    $ref: '../../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../../components/responses.yaml#/ManageForbidden'
  '404':
    $ref: '../../components/responses.yaml#/ManageNotFound'
  '409':
    $ref: '../../components/responses.yaml#/ManageConflict'
  '500':
    $ref: '../../components/responses.yaml#/ManageInternal'