# GET /api/blog-mgr/medias/{name}/references —— 后台管理 API（查询媒体文件的引用情况）
# 注册位置：module/blog_mgr/router/router.go → RegisterService（Handler 实现在 module/user/api/）
operationId: getManageMediaReferences
tags: [blog-manage]
summary: 查询媒体文件的引用情况
description: |
  删除前用于提示破坏性影响：统计该文件名被多少条**未软删除**的内容记录引用，并按资源与字段拆分
  （例如「文章 / 正文」「作品 / 封面」「关于我 / 头像」）。统计方式是按文件名做包含匹配，覆盖封面、
  图标、头像、图集、JSON 设置与 Markdown 正文等所有引用形式。

  `name` 必须是上传目录下的普通文件名（不含路径分隔符），否则返回「文件名不合法」。无引用时
  `references` 为空数组、`total` 为 0。
security:
  - XToken: []
parameters:
  - $ref: '../components/parameters.yaml#/MediaName'
responses:
  '200':
    description: |
      成功时 code 为 0、data 为引用统计；失败时 code 为 1、msg 为具体原因（如「文件名不合法」「查询引用失败」）、
      data 为 {}。
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  oneOf:
                    - $ref: '../components/schemas.yaml#/ManageMediaReferencesResult'
                    - $ref: '../components/schemas.yaml#/EmptyData'
        examples:
          success:
            value:
              code: 0
              msg: 操作成功
              data:
                total: 3
                references:
                  - resource: 文章
                    field: 正文
                    count: 2
                  - resource: 作品
                    field: 封面
                    count: 1
          empty:
            value:
              code: 0
              msg: 操作成功
              data:
                total: 0
                references: []
          failure:
            value:
              code: 1
              msg: 文件名不合法
              data: {}
  '401':
    $ref: '../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../components/responses.yaml#/ManageForbidden'