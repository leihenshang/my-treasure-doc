# PATCH /api/blog-mgr/tools/{id} —— 后台管理 API（更新工具）
# 注册位置：module/blog_mgr/router/router.go → RegisterService → 循环注册同一套泛化 Handler
operationId: updateManageTools
tags: [blog-manage]
summary: 更新工具
description: |
  乐观锁：请求体必须携带当前 `version`（取自详情响应），服务端按 `version` 匹配更新并自增，
  缺失或版本过期返回 409 / code 40900；更新成功后须重新拉取详情以刷新 `version`。

  类型相关校验：`kind = link` 时必须填写合法的 `url`，否则返回 400 / code 40003（`data.field = url`）；
  `kind = own`（自研）时必须填写 `developmentStatus`，否则返回 400 / code 40004（`data.field = developmentStatus`）；
  `slug` 冲突返回 409。
security:
  - XToken: []
parameters:
  - $ref: '../../components/parameters.yaml#/ManageID'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas.yaml#/ManageToolInput'
responses:
  '200':
    description: 更新成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../../components/schemas.yaml#/ManageTool'
  '400':
    $ref: '../../components/responses.yaml#/ManageToolBadRequest'
  '401':
    $ref: '../../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../../components/responses.yaml#/ManageForbidden'
  '404':
    $ref: '../../components/responses.yaml#/ManageNotFound'
  '409':
    $ref: '../../components/responses.yaml#/ManageConflict'
  '500':
    $ref: '../../components/responses.yaml#/ManageInternal'