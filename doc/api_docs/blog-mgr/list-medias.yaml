# GET /api/blog-mgr/medias —— 后台管理 API（媒体库文件列表）
# 注册位置：module/blog_mgr/router/router.go → RegisterService（Handler 实现在 module/user/api/）
operationId: listManageMedias
tags: [blog-manage]
summary: 媒体库文件列表
description: |
  列出 `/files/blog/` 下的全部上传文件，按文件修改时间**倒序**。上传目录不存在时返回空数组而非报错。

  每个文件都标注是否被内容引用（`referenced`）、引用它的内容记录条数（`referenceCount`）与来源明细
  （`references`，按资源/字段拆分）。引用统计通过**一次性扫描**内容的封面 / 图标 / 头像 / 图集 / JSON 设置
  与 Markdown 正文得出，只统计未软删除的记录。

  `ref` 参数可只筛选已引用 / 未引用的文件（缺省 `all`）。
security:
  - XToken: []
parameters:
  - $ref: '../components/parameters.yaml#/MediaRefFilter'
responses:
  '200':
    description: |
      成功时 code 为 0、data 为文件数组（无文件或上传目录不存在时为空数组）；失败时 code 为 1、msg 为具体原因
      （如「读取上传目录失败」「扫描内容引用失败」「读取媒体元数据失败」）、data 为 {}。
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  oneOf:
                    - type: array
                      items:
                        $ref: '../components/schemas.yaml#/ManageMediaFile'
                    - $ref: '../components/schemas.yaml#/EmptyData'
        examples:
          success:
            value:
              code: 0
              msg: 操作成功
              data:
                - name: 9f2c8b1d6e4a0f3c5d7b9a1e2f4c6d8b0a2c4e6f8a1b3d5c7e9f0a2b4c6d8e1f.png
                  path: /files/blog/9f2c8b1d6e4a0f3c5d7b9a1e2f4c6d8b0a2c4e6f8a1b3d5c7e9f0a2b4c6d8e1f.png
                  size: 182734
                  modTime: '2026-09-20T14:32:05+08:00'
                  referenced: true
                  referenceCount: 2
                  references:
                    - resource: 文章
                      field: 正文
                      count: 1
                    - resource: 作品
                      field: 封面
                      count: 1
                  originName: cover.png
                  ext: .png
                  mime: image/png
                  width: 1200
                  height: 630
          failure:
            value:
              code: 1
              msg: 读取上传目录失败
              data: {}
  '401':
    $ref: '../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../components/responses.yaml#/ManageForbidden'