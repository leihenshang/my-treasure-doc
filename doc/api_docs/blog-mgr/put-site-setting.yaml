# PUT /api/blog-mgr/site —— 后台管理 API（保存站点设置）
# 注册位置：module/blog_mgr/router/router.go → RegisterService
operationId: putManageSiteSetting
tags: [blog-manage]
summary: 保存站点设置
description: |
  整份覆盖保存站点设置，返回保存后的对象。违反以下任一条校验即返回 400 / code 40001：

  - `name` 去空格后不能为空；
  - `banner.text` 不超过 100 字符，`banner.backgroundColor` 与 `banner.textColor` 必须是合法的十六进制颜色；
  - 每条 `milestones` 的 `date` 必须是 `YYYY-MM-DD`、`title` 不能为空；
  - `home.title`、`home.ai.title`、`home.ai.description` 不能为空；`home.subtitle` 长度受限
    （超出上限会被服务端替换为默认值，而非报错）；
  - `modules` 的 `id` 必须在固定模块枚举内，缺失的模块由服务端按默认配置补齐。
security:
  - XToken: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../components/schemas.yaml#/ManageSiteInput'
responses:
  '200':
    description: 保存成功
    content:
      application/json:
        schema:
          allOf:
            - $ref: '../components/schemas.yaml#/Envelope'
            - type: object
              properties:
                data:
                  $ref: '../components/schemas.yaml#/ManageSite'
  '400':
    $ref: '../components/responses.yaml#/ManageInvalidRequest'
  '401':
    $ref: '../components/responses.yaml#/ManageUnauthorized'
  '403':
    $ref: '../components/responses.yaml#/ManageForbidden'
  '500':
    $ref: '../components/responses.yaml#/ManageInternal'