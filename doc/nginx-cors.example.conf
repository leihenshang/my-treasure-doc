# 方案 B：nginx 作为 Go 服务（默认 127.0.0.1:2026）的前置反向代理，统一处理 CORS。
# Go 侧已不再设置任何 Access-Control-* 头，跨域完全由本配置负责。
#
# 关键安全约束：
#   - map 使用【精确值】匹配前端 Origin，不要用 *.example.com 这类宽松正则，
#     否则配合 Allow-Credentials: true 会重新打开任意站点读取后台接口的风险。
#   - 仅对白名单命中来源才返回 Allow-Origin 与 Allow-Credentials。

map $http_origin $allow_origin {
    default                       "";
    "https://your-frontend.com"   "https://your-frontend.com";
    "http://localhost:2024"       "http://localhost:2024";
}

server {
    listen 80;
    server_name your-domain.com;

    # 前端静态资源（若由 nginx 直接托管，可选）
    # location / {
    #     root /path/to/web;
    #     try_files $uri $uri/ /index.html;
    # }

    # 反向代理到 Go 服务
    location / {
        # 预检请求在反代层直接返回 204，不进入 Go 处理链
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $allow_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-Token";
            add_header Access-Control-Max-Age "3600";
            return 204;
        }

        # 实际请求：仅白名单命中时返回跨域头
        if ($allow_origin != "") {
            add_header Access-Control-Allow-Origin $allow_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-Token";
        }

        proxy_pass http://127.0.0.1:2026;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
