[app]
host = "localhost"
port = 2021
name = "my_treasure_doc"
runMode = "release" # dev-开发模式 release-生产模式

[database]
# driver 可选：sqlite（默认，零依赖单文件） / postgres
driver = "sqlite"
# sqlite 连接串：单文件 + WAL + 防锁超时
dsn = "file:./treasure_doc.db?_busy_timeout=5000&_journal_mode=WAL&_foreign_keys=on"
tablePrefix = "td_"

# PostgreSQL 示例（将 driver 改为 postgres 并填写下面的 dsn）：
# driver = "postgres"
# dsn = "host=127.0.0.1 user=postgres password=postgres dbname=treasure_doc port=5432 sslmode=disable TimeZone=Asia/Shanghai"

[backup]
# SQLite 定时备份（仅 driver=sqlite 生效；postgres 不会启动）
enable = false
interval = 86400     # 备份周期（秒），86400 = 每天
dir = "backup"       # 备份文件存放目录
compress = true      # 是否 gzip 压缩（生成 .db.gz）
keepDays = 7         # 旧备份保留天数，0 = 不清理

[log]
directory = "log"
showInConsole = true
format = "console"   # [json | console]

[redis]
enable = false
host = "127.0.0.1"
port = 6379
user = ""
password = ""
dbId = 0

[debug]
enableMockLogin = false
mockUserId = "9999999999"

[captcha]
# 登录是否要求图形验证码；缺省为 true
enabled = true

[blogSeed]
enabled = false
allowRemote = false
restoreDeleted = false