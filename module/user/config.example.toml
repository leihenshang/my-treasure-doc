[app]
host = "localhost"
port = 2021
name = "my_treasure_doc"
runMode = "release" # dev-开发模式 release-生产模式

[database]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = "postgres"
dbName = "treasure_doc"
sslMode = "disable"
timeZone = "Asia/Shanghai"
tablePrefix = "td_"

[log]
directory = "log"
showInConsole = true
format = "console"   # [json | console]

[redis]
enable = false
host = "127.0.0.1"
port = 6379
user = ""
password = ""
dbId = 0

[debug]
enableMockLogin = false
mockUserId = "9999999999"

[captcha]
# 登录是否要求图形验证码；缺省为 true
enabled = true

[blogSeed]
enabled = false
allowRemote = false
restoreDeleted = false