[app]
host = "localhost"
port = 2026
name = "my_treasure_doc"
runMode = "release"      # dev-开发模式 release-生产模式
# trustedProxies：信任的反代 IP/CIDR 列表（nginx 等）。命中时才采信 X-Forwarded-For，
# 使 IP 白名单 / 限流拿到真实客户端 IP。空 = 不信任反代头。
trustedProxies = []
# 跨域（CORS）已由前置反向代理（如 nginx）统一处理，Go 侧不再设置任何 Access-Control-* 头。
# 反代需按白名单精确匹配前端 Origin，并在命中时才返回 Allow-Origin 与 Allow-Credentials。

[database]
# driver 可选：sqlite（默认，零依赖单文件） / postgres
driver = "sqlite"
# sqlite 连接串：单文件 + WAL + 防锁超时
dsn = "file:./data/treasure_doc.db?_busy_timeout=5000&_journal_mode=WAL&_foreign_keys=on"
tablePrefix = "td_"

# PostgreSQL 示例（将 driver 改为 postgres 并填写下面的 dsn）：
# driver = "postgres"
# dsn = "host=127.0.0.1 user=postgres password=postgres dbname=treasure_doc port=5432 sslmode=disable TimeZone=Asia/Shanghai"

[backup]
# SQLite 定时备份（仅 driver=sqlite 生效；postgres 不会启动）
enable = false
interval = 86400 # 备份周期（秒），86400 = 每天
dir = "backup"   # 备份文件存放目录
compress = true  # 是否 gzip 压缩（.db.gz）
keepDays = 7     # 旧备份保留天数，0 = 不清理
# autoPack：定时备份是否生成「完整备份包」（treasure_doc.db + files/ 图片 + manifest.json 的 tar.gz）。
# 开启后 NAS 下载接口 /api/backup/export 才有含图片的可迁移完整备份。
autoPack = false
# apiToken：NAS 免登录拉取完整备份的机器令牌（配在 /api/backup/export 的 X-Backup-Token 请求头）。
# 仅开放「导出」，不提供导入/删除；留空表示禁用 NAS 导出接口。
apiToken = ""
# allowIPs：允许调用备份接口（/api/backup/export）的客户端 IP 白名单（精确 IP 或 CIDR）。
# 空 = 不限来源（仅靠 ApiToken 鉴权）；例如限定 NAS 网段：allowIPs = ["192.168.1.0/24"]
allowIPs = []

[log]
directory = "log"
showInConsole = true
format = "console"   # [json | console]

[redis]
enable = false
host = "127.0.0.1"
port = 6379
user = ""
password = ""
dbId = 0

[debug]
enableMockLogin = false
mockUserId = "9999999999"

[captcha]
# 登录是否要求图形验证码；缺省为 true
enabled = true

[blogSeed]
enabled = false
allowRemote = false
restoreDeleted = false

[publish]
# allowIPs：允许调用内容发布接口（/api/publish/*）的客户端 IP 白名单（精确 IP 或 CIDR）。
# 空 = 不限来源（仅靠发布令牌鉴权）；例如只让本机/NAS 调用：allowIPs = ["127.0.0.1", "192.168.1.0/24"]
allowIPs = []
